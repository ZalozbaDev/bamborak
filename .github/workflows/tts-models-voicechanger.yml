name: tts-models-voicechanger
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'refactor_tts_data'
  schedule:
    - cron: "0 0 * * *"

#using-an-action
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_IMAGE_NAME: ${{ github.repository }}-tts-models-voicechanger
      PUSH: ${{ toJSON(github.event_name != 'pull_request') }}
    steps:
      # Setup Docker Environment
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            /tmp/.buildx-cache
          key: buildx|${{ secrets.CACHE_DATE }}|${{ runner.os }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup oras
        uses: oras-project/setup-oras@v1
      - name: Package models and vociechanger data
        run: |
          ./scripts/01_copy_config.sh ; ./scripts/02_copy_models.sh ; scripts/03_copy_voicechanger.sh ;
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          oras push ghcr.io/${OWNER}/backend_data:${{ github.sha }} './backend_data'